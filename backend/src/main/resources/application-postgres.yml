# Run against a real PostgreSQL (docker compose up -d), then:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Secrets come from environment variables, never from source control.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creditlens}
    username: ${DB_USER:creditlens}
    password: ${DB_PASSWORD:creditlens_dev_only}
